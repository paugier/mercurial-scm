stages:
  - image
  - lint
  - test
  - doc
  - deploy

variables:
  DOCKER_IMAGE_PATH: registry.heptapod.net:443/mercurial/hg-website/ci/default

image: $DOCKER_IMAGE_PATH:stable

# Build an image for the above tasks; this should be a scheduled job, as
# it is quite unnecessary to run on every invocation.
image:build:
  stage: image
  tags:
    - container-registry-push
  needs: []
  # comment these rules for MR modifying the Docker file
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_BUILD_IMAGES == "1"'
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [ "" ]
  before_script:
    - ""
  script:
    - |
      cat > /kaniko/.docker/config.json <<EOF
      {
        "auths": {
          "$CI_REGISTRY": {
            "username": "$CI_REGISTRY_USER",
            "password": "$CI_REGISTRY_PASSWORD"
          }
        }
      }
      EOF
    - >
      /kaniko/executor --context $CI_PROJECT_DIR
      --dockerfile $CI_PROJECT_DIR/docker/Dockerfile
      --single-snapshot
      --cleanup
      --destination $DOCKER_IMAGE_PATH:stable


lint:check:
  stage: lint
  needs:
    - job: "image:build"
      optional: true
  script:
    - pdm sync -G format
    - pdm run format-check


mypy:
  stage: lint
  needs:
    - job: "image:build"
      optional: true
  script:
    - pdm sync -G web -G test -G types
    - pdm run type-check
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      when: manual
  allow_failure: true


test:
  stage: test
  needs:
    - job: "image:build"
      optional: true
  script:
    - pdm sync -G web -G test
    - pdm run test


pages:
  stage: doc
  needs:
    - job: "image:build"
      optional: true
  script:
    - pdm sync -G web
    # - pdm run python -m bash_kernel.install
    - pdm build-site
    - mkdir -p public/$CI_COMMIT_REF_NAME
    - rsync -rvc --delete build/html/* public/$CI_COMMIT_REF_NAME/
    # This directory can become too large leading to error.
    # It can be purged with the bottom "Clear runner caches"
    # in https://foss.heptapod.net/mercurial/hg-website/-/pipelines
    - ls public
    - echo "CI_COMMIT_REF_NAME="$CI_COMMIT_REF_NAME
    - echo See https://mercurial.pages.heptapod.net/hg-website/$CI_COMMIT_REF_NAME
  artifacts:
    name: "$CI_COMMIT_REF_NAME"
    paths:
      - public
    expire_in: 5 days
  when: always


# Publish the default branch to www.mercurial-scm.org. The server only lets
# this key rsync into the website directory (see the `website` role in
# hginfra). It needs these protected CI variables:
#
# - WEBSITE_DEPLOY_TARGET: `user@host` to rsync to
# - WEBSITE_DEPLOY_SSH_KEY (file): the private key
# - WEBSITE_DEPLOY_KNOWN_HOSTS (file): the server's SSH host keys
#
# The job does not run while WEBSITE_DEPLOY_TARGET is unset.
deploy:
  stage: deploy
  needs:
    - job: "lint:check"
    - job: test
    - job: pages
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "branch/default" && $WEBSITE_DEPLOY_TARGET'
  resource_group: website-deploy
  script:
    - install -m 700 -d ~/.ssh
    - install -m 600 "$WEBSITE_DEPLOY_SSH_KEY" ~/.ssh/website-deploy
    - install -m 600 "$WEBSITE_DEPLOY_KNOWN_HOSTS" ~/.ssh/known_hosts
    - >
      rsync --recursive --links --checksum --delete-after --delay-updates
      --rsh "ssh -i $HOME/.ssh/website-deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
      "public/$CI_COMMIT_REF_NAME/" "$WEBSITE_DEPLOY_TARGET:./"
